    <script>
        (async () => {
            const contentEl = document.getElementById('content');
            if (!contentEl) {
                console.error('#content не найден — проверь HTML');
                return;
            }

            function normalizePath(path) {
                // Если путь "/" — грузим index.html, иначе оставляем как есть
                return path === '/' ? '/index.html' : path;
            }

            async function loadPage(url) {
                try {
                    const res = await fetch(url);
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);

                    const html = await res.text();
                    const doc = new DOMParser().parseFromString(html, 'text/html');

                    // Берём только нужный фрагмент, чтобы не дублировать head/body
                    const main = doc.querySelector('main') || doc.body;
                    contentEl.innerHTML = main.innerHTML;

                    // Обновляем title
                    document.title = doc.title || 'Мой сайт';

                    // Выполняем скрипты из подгруженного фрагмента
                    const scripts = main.querySelectorAll('script');
                    scripts.forEach(s => {
                        const ns = document.createElement('script');
                        if (s.src) {
                            ns.src = s.src;
                        } else {
                            ns.textContent = s.textContent;
                        }
                        // Копируем атрибуты (async, defer, type и т.д.)
                        Array.from(s.attributes).forEach(a => ns.setAttribute(a.name, a.value));
                        document.head.appendChild(ns);
                    });
                } catch (e) {
                    console.error('Ошибка загрузки страницы:', e);
                    contentEl.innerHTML = '<h1>Страница не найдена</h1>';
                }
            }

            // 1. Инициализация при загрузке
            const initPath = normalizePath(window.location.pathname);
            await loadPage(initPath);

            // 2. Обработка кликов по ссылкам
            document.addEventListener('click', e => {
                const a = e.target.closest('a');
                if (!a) return;

                const href = a.getAttribute('href');
                // Пропускаем якоря (#), внешние ссылки и пустые
                if (!href || href.startsWith('#') || href.startsWith('http')) return;

                e.preventDefault();

                const path = normalizePath(href.startsWith('/') ? href : '/' + href);
                history.pushState({ path }, '', path);
                loadPage(path); // Здесь loadPage видна, потому что она внутри той же IIFE
            });

            // 3. Обработка кнопки «Назад/Вперёд»
            window.addEventListener('popstate', e => {
                if (e.state?.path) {
                    loadPage(e.state.path);
                } else {
                    loadPage(normalizePath(window.location.pathname));
                }
            });
        })();   
    </script>
</body>

</html>
